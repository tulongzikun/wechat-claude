# ══════════════════════════════════════════════════════════════════
# 推送任务注册表（新增定时推送的唯一登记处）
# ══════════════════════════════════════════════════════════════════
# 行格式（竖线分隔，# 开头为注释）：
#   任务名 | cron 表达式 | 专属 webhook 变量 | 说明
#
#   任务名        = jobs/<任务名>.py，由 run.sh <任务名> 调起
#   cron 表达式   = 登记用（实际生效以 crontab 为准，list_tasks.sh 会交叉核对）
#   webhook 变量  = 该任务推哪个企微群（.env 里配；未配回落通用 WECOM_WEBHOOK）
#
# ── 新增推送任务四步（规范）──────────────────────────────────────
# ① 写 jobs/<任务名>.py：
#    - 复用 daily_update 的推送/工具：from daily_update import push, fit_bytes, log
#    - 推送：push(text, hook_env="WECOM_WEBHOOK_<大写任务名>")——双通道（企微+个人微信）
#    - 字节预算：企微 markdown 上限 4096 字节（中文 1 字=3 字节），全文过一遍
#      fit_bytes()；LLM 产出超预算先压缩重生成一次，再 fit_bytes 兜底
#    - 经 bigmodel 网关的内容要过敏感词（内鬼/爆料等会 1301 拒绝），送模型前脱敏
#    - 支持 --dry-run（只抓+总结+打印，不推送）
# ② 在本文件加一行登记
# ③ crontab 加一条（CRON_TZ=Asia/Shanghai 段内；注意脚本用 run.sh 调用）：
#      <cron 表达式> /home/<user>/workspace/wechat/jobs/run.sh <任务名> \
#          >> /home/<user>/workspace/wechat/jobs/<任务名>.log 2>&1
#    装完 crontab 立刻 ls -l run.sh 确认可执行位（cron 直调脚本必须 +x，踩过）
# ④ 需要专属群则在 .env 加 WECOM_WEBHOOK_<变量>（可逗号分隔多群）；
#    共用通用群则跳过此步
# 验证：bash jobs/run.sh <任务名> --dry-run && bash jobs/list_tasks.sh
# ──────────────────────────────────────────────────────────────────

daily_update   | 0 17 * * * | WECOM_WEBHOOK_DAILY  | 每天 17:00 workspace 各仓 mainline 提交摘要（DAILY_REPO_FILTER 可过滤仓库）
weekly_papers  | 0 10 * * 1 | WECOM_WEBHOOK_PAPERS | 每周一 10:00 arXiv q-fin 上周论文 Top10 速递
games_news     | 0 10 * * 2 | WECOM_WEBHOOK_GAMES  | 每周二 10:00 米哈游游戏资讯（更新/未实装情报/联动）
macro_weekly   | 0 10 * * 4 | WECOM_WEBHOOK_MACRO  | 每周四 10:00 宏观周报（数据发布/中国基本面/市场周表现/行业景气/前瞻）
